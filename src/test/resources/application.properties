spring.application.name=UIT_VIRTUAL_CAMPUS_TEST

spring.datasource.url=jdbc:h2:mem:uit_virtual_campus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS public
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.supabase.co/auth/v1
app.security.jwt.audience=authenticated
app.cors.allowed-origins=http://localhost:3000,https://example.com
