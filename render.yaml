services:
  - type: web
    name: uit-virtual-campus-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_ISSUER_URI
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
